env:
  train:
    env_type: libero
    task_suite_name: libero_10
    total_num_envs: 16
    auto_reset: false
    ignore_terminations: false
    max_steps_per_rollout_epoch: 480
    max_episode_steps: 480
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    use_rel_reward: true
    reward_coef: 1.0
    reset_gripper_open: true
    is_eval: false
    seed: 0
    group_size: 8
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ../results/video/train
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 1
  eval:
    env_type: libero
    task_suite_name: libero_10
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    max_steps_per_rollout_epoch: 480
    max_episode_steps: 480
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    use_rel_reward: true
    reward_coef: 5.0
    reset_gripper_open: true
    is_eval: true
    seed: 0
    group_size: 1
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ../results/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 1
  group_name: EnvGroup
actor:
  model:
    model_type: openpi
    precision: null
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 10
    action_dim: 7
    use_proprio: true
    num_steps: 4
    add_value_head: false
    openpi:
      task: rl
      config_name: pi05_libero
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 10
      num_steps: 4
      train_expert_only: true
      action_env_dim: 7
      noise_method: flow_sde
      add_value_head: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: false
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      torch_compile: false
    model_path: /path/to/model/RLinf-Pi05-LIBERO-SFT
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 32
  seed: 42
  enable_offload: false
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_grpo_openpi_pi05_mani_v1_smoke
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_group_success_metrics: true
  manifold:
    mode: task_plus_geometry
    eligible_groups: any_success
    weight: 0.2
    feature:
      source: action_expert_pre_output
      denoise_step: last
      storage_dtype: float32
    geometry:
      granularity: action
      tle_k: 10
      tle_epsilon: 0.0001
      compute_dtype: float64
      score: volume_exp_neg_dim
      alpha: 0.1
    prefix:
      rule: min_success_actions
      update_boundary: full_chunk
    normalization:
      std_correction: 1
      epsilon: 1.0e-06
      min_group_std: 1.0e-06
    diagnostics:
      audit_dir: null
      dimension_metrics: false
      debug_hidden_max_trajectories: 0
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/model/RLinf-Pi05-LIBERO-SFT
    precision: null
  enable_torch_compile: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
