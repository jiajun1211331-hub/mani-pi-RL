# Shared by all manifold modes and scores; tests compare the native recipe.
defaults:
- env/libero_10@env.train
- env/libero_10@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_grpo_openpi_pi05_mani_v1
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_group_success_metrics: true
  manifold:
    mode: task_plus_geometry
    eligible_groups: any_success
    weight: 0.2
    feature:
      source: action_expert_pre_output
      denoise_step: last
      storage_dtype: float32
    geometry:
      granularity: action
      tle_k: 10
      tle_epsilon: 0.0001
      compute_dtype: float64
      score: volume_exp_neg_dim
      alpha: 0.1
    prefix:
      rule: min_success_actions
      update_boundary: full_chunk
    normalization:
      std_correction: 1
      epsilon: 1.0e-06
      min_group_std: 1.0e-06
    diagnostics:
      audit_dir: null
      dimension_metrics: false
      debug_hidden_max_trajectories: 0
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    group_size: 8
    auto_reset: false
    ignore_terminations: false
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/model/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  model:
    model_path: /path/to/model/RLinf-Pi05-LIBERO-SFT
    num_steps: 4
    num_action_chunks: 10
    openpi:
      task: rl
      noise_method: flow_sde
      train_expert_only: true
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
